apiVersion: v1
kind: Secret
metadata:
  name: user-secret
  namespace: demo
data:
  username: YWRtaW4=
  password: bXlwYXNzd29yZDEyMw==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-configmap
  namespace: demo
data:
  url: "www.google.com"
  port: "8080"
---

apiVersion: v1
kind: Pod
metadata:
  name: env-single-secret
  namespace: demo
spec:
  containers:
  - name: envars-test-container
    image: nginx
    env:
    - name: SECRET_USERNAME
      valueFrom:
        secretKeyRef:
          name: user-secret # Name of the secret
          key: username # name of the key
    - name: SECRET_PASSWORD
      valueFrom:
        secretKeyRef:
          name: user-secret # Name of the secret
          key: password # name of the key
    - name: URL
      valueFrom:
        configMapKeyRef:
          name: user-configmap # Name of the secret
          key: url # name of the key
    - name: PORT
      valueFrom:
        configMapKeyRef:
          name: user-configmap # Name of the secret
          key: port # name of the key